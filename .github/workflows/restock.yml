name: 재입고 알림

on:
  schedule:
    - cron: "*/5 * * * *" # 5분마다 (GitHub 사정에 따라 몇 분씩 늦어질 수 있어요)
    repository_dispatch:
    types: [check]
  workflow_dispatch:
    inputs:
      kakao_url:
        description: "카카오 처음 연결용: 로그인 후 주소창의 전체 주소 (처음 1번만, 평소엔 비워두세요)"
        required: false
        default: ""
      test_message:
        description: "테스트 카톡 보내기"
        type: boolean
        default: false

permissions:
  contents: write # 상태 파일(state 폴더)을 저장하려고 필요해요

concurrency:
  group: restock-alert
  cancel-in-progress: false

# 감시할 옵션·카톡 횟수·알림 켜기/끄기·상품 주소는 이 파일을 고치지 말고
# [Actions] > '알림 설정 바꾸기'에서 바꿔요.
env:
  # 카카오 콘솔에 등록한 리다이렉트 URI와 글자 하나까지 같아야 해요
  KAKAO_REDIRECT_URI: "https://example.com"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }} # 직전 실행이 저장한 최신 상태부터 시작

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 필요한 도구 설치
        run: pip install --quiet --disable-pip-version-check requests beautifulsoup4

      - name: 상품 확인 & 카톡 알림
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          KAKAO_AUTH_URL: ${{ inputs.kakao_url }}
          SEND_TEST: ${{ inputs.test_message }}
        run: python restock.py

      - name: 상태 저장
        if: always()
        run: |
          [ -d state ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          git commit --quiet -m "상태 업데이트"
          for i in 1 2 3; do
            if git pull --quiet --rebase origin "$GITHUB_REF_NAME" && git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then
              echo "상태 저장 완료"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "상태 저장 실패"
          exit 1
